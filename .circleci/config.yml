version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:24.22.0

jobs:
  test:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run tests
          command: npm test
      - run:
          name: Pack the package
          command: |
            mkdir -p dist
            npm pack --pack-destination dist
      - persist_to_workspace:
          root: .
          paths:
            - dist

  publish:
    executor: node
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Publish to npm with trusted publishing
          command: |
            NPM_ID_TOKEN="$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')"
            export NPM_ID_TOKEN
            npm publish ./dist/*.tgz --access public

workflows:
  test-and-publish:
    jobs:
      - test:
          filters: pipeline.git.branch or (pipeline.git.tag matches /^v[0-9]+\.[0-9]+\.[0-9]+$/)
      - publish:
          requires:
            - test
          filters: pipeline.git.tag matches /^v[0-9]+\.[0-9]+\.[0-9]+$/
